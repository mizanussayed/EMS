services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: EMS.Api
      Jwt__Audience: EMS.Client
      Jwt__Key: ReplaceWithAStrongKey_ChangeMe123!
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ems;Username=ems;Password=ems
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  backend-data:
  postgres-data:
